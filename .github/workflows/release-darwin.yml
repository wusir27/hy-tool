name: release-darwin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to attach Darwin hy-tui bins
        required: true
        default: tui-v0.1.0

permissions:
  contents: write

jobs:
  darwin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build Apple Silicon and Intel
        working-directory: client/tui
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp target/aarch64-apple-darwin/release/hy-tui "$GITHUB_WORKSPACE/dist/hy-tui-darwin-arm64"
          cp target/x86_64-apple-darwin/release/hy-tui "$GITHUB_WORKSPACE/dist/hy-tui-darwin-amd64"
          chmod +x "$GITHUB_WORKSPACE/dist/hy-tui-darwin-arm64" "$GITHUB_WORKSPACE/dist/hy-tui-darwin-amd64"
          (cd "$GITHUB_WORKSPACE/dist" && shasum -a 256 hy-tui-darwin-arm64 hy-tui-darwin-amd64 > SHA256SUMS-darwin)
          git rev-parse HEAD
          file "$GITHUB_WORKSPACE/dist/hy-tui-darwin-arm64" "$GITHUB_WORKSPACE/dist/hy-tui-darwin-amd64"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            dist/hy-tui-darwin-arm64 \
            dist/hy-tui-darwin-amd64 \
            --clobber
          gh release download "${{ inputs.tag }}" -p SHA256SUMS -O SHA256SUMS.old || true
          { grep -v 'hy-tui-darwin-' SHA256SUMS.old || true; cat dist/SHA256SUMS-darwin; } > SHA256SUMS
          gh release upload "${{ inputs.tag }}" SHA256SUMS --clobber
