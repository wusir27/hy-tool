name: release-linux-gnu

# V1: gnu bins must target glibc 2.34 (Ubuntu 22.04 host is 2.35 — pin via zig).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to attach Linux gnu hy-tui bins
        required: true
        default: tui-v0.1.0

permissions:
  contents: write

jobs:
  gnu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Install zig + cargo-zigbuild
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          sudo tar -C /usr/local -xJf /tmp/zig.tar.xz
          echo "/usr/local/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.21.8
      - name: Build gnu targets against glibc 2.34
        working-directory: client/tui
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.34
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.34
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp target/x86_64-unknown-linux-gnu/release/hy-tui "$GITHUB_WORKSPACE/dist/hy-tui-linux-amd64"
          cp target/aarch64-unknown-linux-gnu/release/hy-tui "$GITHUB_WORKSPACE/dist/hy-tui-linux-arm64"
          chmod +x "$GITHUB_WORKSPACE/dist/hy-tui-linux-amd64" "$GITHUB_WORKSPACE/dist/hy-tui-linux-arm64"
          sh "$GITHUB_WORKSPACE/.github/scripts/check-glibc-max.sh" "$GITHUB_WORKSPACE/dist/hy-tui-linux-amd64" 2.34
          sh "$GITHUB_WORKSPACE/.github/scripts/check-glibc-max.sh" "$GITHUB_WORKSPACE/dist/hy-tui-linux-arm64" 2.34
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum hy-tui-linux-amd64 hy-tui-linux-arm64 > SHA256SUMS)
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            dist/hy-tui-linux-amd64 \
            dist/hy-tui-linux-arm64 \
            --clobber
          gh release download "${{ inputs.tag }}" -p SHA256SUMS -O SHA256SUMS.old || true
          { grep -vE 'hy-tui-linux-(amd64|arm64)$' SHA256SUMS.old || true; cat dist/SHA256SUMS; } > SHA256SUMS
          gh release upload "${{ inputs.tag }}" SHA256SUMS --clobber
