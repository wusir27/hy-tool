[package]
name = "hy-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Terminal UI to write hy client.yaml, download hy, and Start with --route (U3)"
publish = false

[[bin]]
name = "hy-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
ureq = "2.12"
